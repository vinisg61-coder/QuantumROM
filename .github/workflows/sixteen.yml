name: Build QuantumROM Aurora.

on:
  workflow_dispatch:
    inputs:
      STOCK_DEVICE:
        description: "STOCK_DEVICE_MODEL or None"
        required: true
        default: "SM-A528B"
      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        default: "True"
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-S711B"
      TARGET_DEVICE_CSC:
        description: "TARGET_DEVICE_CSC."
        required: true
        default: "EUX"
      TARGET_DEVICE_IMEI:
        description: "TARGET_DEVICE_IMEI."
        required: true
        default: "350389910895757"
      OUTPUT_FILESYSTEM:
        description: "OUTPUT_FILESYSTEM. e.g erofs / ext4 / f2fs"
        required: true
        default: "erofs"
      TARGET_FW_VERSION:
        description: "Exact QuantumROM donor firmware version"
        required: true
        default: "S711BXXSFGZE2/S711BOXMFGZE2/S711BXXSFGZE2/S711BXXSFGZE2"
      PIXELDRAIN_API_KEY:
        description: "Pixeldrain API key (optional — leave blank to skip upload)"
        required: false
        default: ""

jobs:
  build:
    name: Start QuantumROM Aurora Build.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4

      - name: Validate STOCK_DEVICE
        run: |
          STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          DEVICE_PATH="QuantumROM/Devices/$STOCK_DEVICE"
          if [ "$STOCK_DEVICE" != "None" ] && [ ! -d "$DEVICE_PATH" ]; then
            echo "❌ $STOCK_DEVICE is not supported with this tool."
            exit 1
          fi

      - name: Remove unnecessary files.
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Install Dependencies.
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-21-jdk jq perl xxd kmod erofs-utils linux-modules-extra-$(uname -r)
          sudo modprobe f2fs
          sudo pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          mkdir -p FW WORK OUT

      - name: Download firmware ▶️ ${{ github.event.inputs.TARGET_DEVICE }} - ${{ github.event.inputs.TARGET_DEVICE_CSC }}
        run: |
          source scripts/QuantumRom.sh
          DOWNLOAD_FIRMWARE "${{ github.event.inputs.TARGET_DEVICE }}" "${{ github.event.inputs.TARGET_DEVICE_CSC }}" "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" "FW" "${{ github.event.inputs.TARGET_FW_VERSION }}"

      - name: Extract firmware
        run: |
          source scripts/QuantumRom.sh
          EXTRACT_FIRMWARE "FW/${{ github.event.inputs.TARGET_DEVICE }}"

      - name: Download extra partition images (odm/vendor) from GitHub Release
        env:
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -e

          if [ "$STOCK_DEVICE" = "SM-A528B" ]; then
            RELEASE_REPO="${{ github.repository }}"
            RELEASE_TAG="a52sxq-extras"
          else
            RELEASE_REPO="miguelbarretoo/QuantumROM"
            RELEASE_TAG="extra-files"
          fi

          SUPPORTED_DEVICES=("SM-G780F" "SM-G980F" "SM-G988B" "SM-A528B")

          IS_SUPPORTED=false
          for d in "${SUPPORTED_DEVICES[@]}"; do
            if [ "$d" == "$STOCK_DEVICE" ]; then
              IS_SUPPORTED=true
              break
            fi
          done

          if [ "$IS_SUPPORTED" = false ]; then
            echo "ℹ️ $STOCK_DEVICE does not need extra odm/vendor files. Skipping."
            exit 0
          fi

          EXTRAS_DIR="QuantumROM/Devices/${STOCK_DEVICE}/extra"
          TMP_ODM="extra-files/odm"
          TMP_VENDOR="extra-files/vendor"

          mkdir -p "$TMP_ODM" "$TMP_VENDOR" "$EXTRAS_DIR"

          BASE_URL="https://github.com/${RELEASE_REPO}/releases/download/${RELEASE_TAG}"

          echo "⬇️  Downloading odm.img for $STOCK_DEVICE..."
          if curl -f -L -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE_URL}/${STOCK_DEVICE}-odm.img" -o "$TMP_ODM/odm.img"; then
            mv "$TMP_ODM/odm.img" "$EXTRAS_DIR/odm.img"
            echo "✅ odm.img saved to $EXTRAS_DIR"
          else
            echo "⚠️  No odm.img asset found for $STOCK_DEVICE, skipping."
          fi

          echo "⬇️  Downloading vendor.img for $STOCK_DEVICE..."
          if curl -f -L -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE_URL}/${STOCK_DEVICE}-vendor.img" -o "$TMP_VENDOR/vendor.img"; then
            mv "$TMP_VENDOR/vendor.img" "$EXTRAS_DIR/vendor.img"
            echo "✅ vendor.img saved to $EXTRAS_DIR"
          else
            echo "⚠️  No vendor.img asset found for $STOCK_DEVICE, skipping."
          fi

      - name: Adjust build partitions based on available extras
        env:
          STOCK_DEVICE: ${{ github.event.inputs.STOCK_DEVICE }}
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -e

          if [ "$STOCK_DEVICE" = "SM-A528B" ]; then
            RELEASE_REPO="${{ github.repository }}"
            RELEASE_TAG="a52sxq-extras"
          else
            RELEASE_REPO="miguelbarretoo/QuantumROM"
            RELEASE_TAG="extra-files"
          fi

          EXTRAS_DIR="QuantumROM/Devices/${STOCK_DEVICE}/extra"
          BASE_PARTITIONS="product,system_ext,system"
          EXTRA_PARTITIONS=""

          if [ -f "$EXTRAS_DIR/vendor.img" ]; then
            EXTRA_PARTITIONS="${EXTRA_PARTITIONS},vendor"
          else
            echo "⚠️  vendor.img not found in $EXTRAS_DIR — vendor partition will be skipped."
          fi

          if [ -f "$EXTRAS_DIR/odm.img" ]; then
            EXTRA_PARTITIONS="${EXTRA_PARTITIONS},odm"
          else
            echo "⚠️  odm.img not found in $EXTRAS_DIR — odm partition will be skipped."
          fi

          if [ "$STOCK_DEVICE" = "SM-A528B" ]; then
            echo "⬇️  Downloading native A52s boot/dtbo bundle..."
            if curl -f -L -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://github.com/${RELEASE_REPO}/releases/download/${RELEASE_TAG}/SM-A528B-boot-dtbo.zip" \
                -o "$EXTRAS_DIR/boot-dtbo.a52sxq.zip"; then
              echo "✅ boot-dtbo.a52sxq.zip saved to $EXTRAS_DIR"
            else
              echo "❌ Native A52s boot/dtbo bundle is required but was not found."
              exit 1
            fi
            [ -f "$EXTRAS_DIR/vendor.img" ] || { echo "❌ Native A52s vendor.img is required."; exit 1; }
            [ -f "$EXTRAS_DIR/odm.img" ] || { echo "❌ Native A52s odm.img is required."; exit 1; }
            EXTRA_PARTITIONS=",vendor,odm"
          fi

          FINAL_PARTITIONS="${BASE_PARTITIONS}${EXTRA_PARTITIONS}"
          echo "✅ BUILD_PARTITIONS will be: $FINAL_PARTITIONS"

          sed -i "s|^export BUILD_PARTITIONS=.*|export BUILD_PARTITIONS=\"${FINAL_PARTITIONS}\"|" sixteen.sh

      - name: Start Rom Build For ${{ github.event.inputs.STOCK_DEVICE }}
        run: |
          sudo bash sixteen.sh \
            "${{ github.event.inputs.STOCK_DEVICE }}" \
            "${{ github.event.inputs.USE_UI_8_TETHERING_APEX }}" \
            "${{ github.event.inputs.TARGET_DEVICE }}" \
            "${{ github.event.inputs.TARGET_DEVICE_CSC }}" \
            "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" \
            "${{ github.event.inputs.OUTPUT_FILESYSTEM }}"

      - name: Compress all .img & make zip file before upload.
        run: |
          export STOCK_DEVICE="${{ github.event.inputs.STOCK_DEVICE }}"
          export TARGET_DEVICE="${{ github.event.inputs.TARGET_DEVICE }}"
          bash scripts/flashable_zip.sh

      - name: Upload to Pixeldrain
        if: ${{ github.event.inputs.PIXELDRAIN_API_KEY != '' }}
        env:
          PIXELDRAIN_API_KEY: ${{ github.event.inputs.PIXELDRAIN_API_KEY }}
        run: |
          ZIP_PATH="$(find OUT -name "QuantumROM*.zip" | head -n1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "❌ No zip found in OUT/ to upload."
            exit 1
          fi

          ZIP_NAME="$(basename "$ZIP_PATH")"
          echo "📤 Uploading $ZIP_NAME to Pixeldrain..."

          RESPONSE="$(curl -s \
            -u ":${PIXELDRAIN_API_KEY}" \
            -F "file=@${ZIP_PATH};filename=${ZIP_NAME}" \
            "https://pixeldrain.com/api/file")"

          FILE_ID="$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")"

          if [ -z "$FILE_ID" ]; then
            echo "❌ Pixeldrain upload failed. Response: $RESPONSE"
            exit 1
          fi

          PD_LINK="https://pixeldrain.com/u/${FILE_ID}"
          echo ""
          echo "✅ Upload successful!"
          echo "🔗 Pixeldrain link: $PD_LINK"
          echo ""
          echo "PD_LINK=$PD_LINK" >> "$GITHUB_ENV"

      - name: Print download links
        run: |
          echo ""
          echo "========================================"
          echo "         QuantumROM Build Complete"
          echo "========================================"
          ZIP_NAME="$(find OUT -name "QuantumROM*.zip" -printf '%f\n' | head -n1)"
          echo "📦 ROM: $ZIP_NAME"
          if [ -n "${PD_LINK:-}" ]; then
            echo "🔗 Pixeldrain: $PD_LINK"
          else
            echo "ℹ️  Pixeldrain: skipped (no API key provided)"
          fi
          echo "========================================"

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumROM-${{ github.event.inputs.STOCK_DEVICE }}
          path: |
            OUT/QuantumROM*.zip*
